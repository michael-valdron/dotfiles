[Sh]
# --- Functions ---
fun=%cursor%() {\n\t%cursor%\n}  # Basic function definition

func_args=%cursor%(%$1%$2%$3%$4%$5) {\n\t%cursor%\n} # Function with arguments (placeholder for actual logic)

# --- Control Flow ---
if=if [ %cursor% ]; then\n\t%cursor%\nfi  # Basic if statement

elif=elif [ %cursor% ]; then\n\t%cursor%\nelif  # Elif block

elsee=else\n\t%cursor%\nfi # Else block

case=%cursor% in\n\tpattern1)\n\t\t%cursor%\n\t;;\n\tpattern2)\n\t\t%cursor%\n\t;;\n\tesac  # Case statement (basic)

while=while %cursor%; do\n\t%cursor%\ndone # While loop

until=until %cursor%; do\n\t%cursor%\ndone # Until loop

for_range=for i in $(seq %start% %end%); do\n\t%cursor%\ndone  # For loop with a range of numbers

for_each=for i in "${%cursor%}"; do\n\t%cursor%\ndone  # Foreach loop

for_eacha=for i in "${%cursor%[@]}"; do\n\t%cursor%\ndone  # Foreach (array) loop

# --- Argument Parsing (Expanded) ---
pargs=POSITIONAL_ARGS=()\n\n# parse arguments\nwhile [[ $# -gt 0 ]]; do\n\tcase "$1" in\n\t\t--flag|-f)\n\t\t\tshift 1\n\t\t;;\n\t\t-*|--*)\n\t\t\techo "unknown flag arg $1" >2&\n\t\t\texit 1\n\t\t;;\n\t\t*)\n\t\t\tPOSITIONAL_ARGS+=("$1")\n\t\t\tshift 1\n\t\t;;\n\tesac\ndone\n\nset -- "${POSITIONAL_ARGS[@]}" # restore parameters  # Argument parsing (basic)

pargs_default=%cursor%() {\n\n  local OPTIONAL_ARGUMENT=""\n  while getopts "a:b:" opt;\n    case $opt in\n      a)\n        OPTIONAL_ARGUMENT="$OPTARG"\n        ;; \n      b)\n        echo "Option b with value: $OPTARG"\n        ;; \n      \?)\n        echo "Invalid option: -$OPTARG" >&2\n        exit 1\n        ;; \n      :) \n        echo "Option -$OPTARG requires an argument." >&2\n        exit 1\n        ;; \n    esac\n  done\n\n  # Shift off the options\n  shift $((OPTIND - 1))\n\n  %cursor%\n}\n # Argument parsing with getopts

# --- Command Existence Checks (Expanded)---
cmd_nexist=if ! command -v %cursor% > /dev/null; then\n\techo "command '%cursor%' does not exist" >2&\n\texit 1\nfi  # Check if a command exists (negative check)

cmd_exist=if command -v %cursor% > /dev/null; then\n\t# Command exists, do something\n\techo "command '%cursor%' exists"\nfi # Check if a command exists (positive check)

# --- File and Directory Operations ---
mkdir_p=mkdir -p %cursor%  # Create directory with parent directories as needed.

touch_file=touch %cursor% # Creates an empty file or updates timestamp of existing one

cp_r=cp -r %source% %destination% # Copy a directory recursively

mv_file=mv %source% %destination% # Move/rename a file or directory

rm_rf=rm -rf %cursor%  # Remove files and directories forcefully (use with caution!)

find_files=find %start_dir% -name "%pattern%"  # Find files matching a pattern.

grep_file=grep "%pattern%" %file% # Search for a pattern in a file

head_lines=head -n %number% %file% # Display the first N lines of a file

tail_lines=tail -n %number% %file% # Display the last N lines of a file

# --- String Manipulation ---
str_replace=sed 's/%search%/ %replace% /g' %cursor%  # Replace string in a file or variable.

str_trim=sed 's/^[[:space:]]*//;s/[[:space:]]*$//' %cursor% # Trim leading and trailing whitespace from a string.

str_substr=cut -c %start%-%end% %cursor%  # Extract substring from a string.

str_split=echo %cursor% | tr ' ' '\n' # Split a string into lines (using space as delimiter).

# --- Process Management ---
background=%cursor% &  # Run a command in the background

wait_process=wait %job_id% # Wait for a background process to complete.

# --- Network Operations ---
ping_host=ping -c %count% %host% # Ping a host a certain number of times.

wget_file=wget %url%  # Download a file from the web.

# --- Error Handling ---
try_catch=set -e; %cursor%; echo "Error occurred" # Exit immediately if any command fails, and print an error message.

# --- Input/Output Redirection ---
redirect_output= %cursor% > %file%  # Redirect standard output to a file.

redirect_input= %cursor% < %file%  # Redirect standard input from a file.

append_output= %cursor% >> %file% # Append standard output to a file.

# --- Debugging ---
set_xtrace=set -x # Enable tracing of commands (useful for debugging).

reset_xtrace=set +x # Disable tracing.

# ---  Working with Arrays ---
array_declare=(%cursor%) # Declare an array

array_access=${array[index]} # Access element in the array

array_length=${#array[@]} # Get length of the array

# --- Using Here Documents ---
heredoc=<<END\n%cursor%\nEND  # Use a here document to pass multi-line input.
